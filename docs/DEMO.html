function setL(l){
  if(!T[l]) l = 'en';
  window.__l = l;
  document.documentElement.lang = l;
  const d = T[l];
  document.getElementById('h1').textContent = d.h1;
  document.getElementById('lead').textContent = d.lead;
  document.getElementById('ctaT').textContent = d.ctaT;
  document.getElementById('ctaP').textContent = d.ctaP;
  document.getElementById('ctaF').textContent = d.ctaF;
  document.getElementById('items').innerHTML = d.items.map(x => `
    <section class="item">
      <figure><img src="/docs/demo/${window.__l || 'en'}/${x.img}" alt="${x.t}" loading="lazy"></figure>
      <h2>${x.t}</h2>
      <p>${x.d}</p>
      <ul>${x.li.map(i => `<li>${i}</li>`).join('')}</ul>
    </section>`).join('');
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  try{ localStorage.setItem('gt_lang', l); }catch(e){}
}
