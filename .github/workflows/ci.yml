name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install cryptography pytest
      - name: Compile
        run: python -m py_compile game_tracker.py ui.py license.py desktop.py
      - name: License unit tests
        run: python -m pytest -q tests/test_license.py
      - name: Fee regression tests
        run: python -m pytest -q tests/fee_pct_test.py
      - name: Local API test
        run: python tests/local_test.py
